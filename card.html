<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop | Cart</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-shopping-cart"></i> Your Cart</h1>
        <div id="cartItems"></div>
        <div id="total" class="total"></div>

        <div class="checkout-form" id="checkoutForm" style="display:none;">
            <h3>Checkout</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="customerName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="customerPhone" placeholder="09123456789">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="customerAddress" placeholder="Your address">
            </div>
            <button class="btn" id="placeOrderBtn">
                <span>Place Order</span>
            </button>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
